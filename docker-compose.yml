# Local stack:
#   app-db   application database (users, products, matches); stands in for RDS locally
#   n8n      workflow engine, editor at http://localhost:5678
#   n8n-db   n8n's own storage (workflows, credentials, execution history)
#
#   docker compose up -d        start
#   docker compose down         stop (data kept in named volumes)
#   docker compose down -v      stop and wipe all data
#
# Settings come from .env (copy .env.example). N8N_ENCRYPTION_KEY must stay the
# same once set: n8n encrypts saved credentials with it.

services:
  app-db:
    image: postgres:16.4
    container_name: loan-engine-db
    environment:
      POSTGRES_DB: ${DB_NAME:-loans}
      POSTGRES_USER: ${DB_USER:-loans}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loans_local_pw}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
      # Runs once, on the first start with an empty volume, in file-name order.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  n8n-db:
    image: postgres:16.4
    container_name: loan-engine-n8n-db
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n_local_pw}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No host port: only n8n talks to this database.

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.7
    container_name: loan-engine-n8n
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n_local_pw}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      # Public base URL n8n prints for webhooks; becomes the tunnel URL once Lambda needs to call in.
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      # Keep execution history from growing without bound: drop runs older than 7 days.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow JSON files for `n8n import:workflow` / `n8n export:workflow`.
      - ./n8n/workflows:/workflows
    depends_on:
      n8n-db:
        condition: service_healthy
      app-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  app_db_data:
  n8n_db_data:
  n8n_data:
